[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blendsmith"
version = "0.0.2"
description = "Production control loop for AI-assisted Blender: decomposition, method selection, review, recovery, and human approval"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = [
  "blender",
  "ai-agents",
  "3d",
  "automation",
  "codex",
  "agentic-workflow",
  "loop-harness",
  "visual-review",
]
dependencies = [
  "jsonschema>=4.21,<5",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
]

[project.scripts]
blendsmith = "blendsmith.cli:main"

[project.urls]
Homepage = "https://github.com/Soph1yzzz/blendsmith"
Repository = "https://github.com/Soph1yzzz/blendsmith"
Issues = "https://github.com/Soph1yzzz/blendsmith/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blendsmith = ["schemas/*.json", "profiles/*.json", "skills/codex/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
