[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blendsmith"
version = "0.0.1"
description = "Production loop harness for AI-assisted Blender: method selection, visual QA, repair, checkpoints, and human approval"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
  "blender",
  "ai-agents",
  "3d",
  "automation",
  "codex",
  "agentic-workflow",
  "loop-harness",
  "visual-review",
]
dependencies = [
  "jsonschema>=4.21,<5",
  "Pillow>=10,<13",
]

classifiers = [
  "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
]

[project.scripts]
blendsmith = "blendsmith.cli:main"

[project.urls]
Homepage = "https://github.com/Soph1yzzz/blendsmith"
Repository = "https://github.com/Soph1yzzz/blendsmith"
Issues = "https://github.com/Soph1yzzz/blendsmith/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blendsmith = ["schemas/*.json", "profiles/*.json", "skills/codex/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
